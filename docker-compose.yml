version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: presentation_dev_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-presentation_db}
      POSTGRES_USER: ${DB_USER:-presentation_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-presentation_password}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - presentation_net
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend/Dockerfile.dev
    container_name: presentation_dev_backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-dev-insecure-secret-key-3d-presentation}
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - DB_NAME=${DB_NAME:-presentation_db}
      - DB_USER=${DB_USER:-presentation_user}
      - DB_PASSWORD=${DB_PASSWORD:-presentation_password}
      - DB_HOST=db
      - DB_PORT=5432
      - USE_SQLITE_FALLBACK=False
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - presentation_net

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend/Dockerfile.dev
    container_name: presentation_dev_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_ENABLE_THEATRE_STUDIO=true
    depends_on:
      - backend
    networks:
      - presentation_net

volumes:
  postgres_dev_data:

networks:
  presentation_net:
    driver: bridge
