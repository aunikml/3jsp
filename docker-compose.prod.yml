version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: presentation_prod_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - presentation_internal_net
    # Security: PostgreSQL is NOT exposed to the host/public network

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend/Dockerfile.prod
    container_name: presentation_prod_backend
    restart: always
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,nginx}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - USE_SQLITE_FALLBACK=False
      - DJANGO_SETTINGS_MODULE=config.settings.production
    depends_on:
      - db
    networks:
      - presentation_internal_net

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend/Dockerfile.prod
    container_name: presentation_prod_frontend
    restart: always
    networks:
      - presentation_internal_net

  nginx:
    image: nginx:alpine
    container_name: presentation_prod_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - presentation_internal_net

volumes:
  postgres_prod_data:

networks:
  presentation_internal_net:
    driver: bridge
